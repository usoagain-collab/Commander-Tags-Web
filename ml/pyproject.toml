[project]
name = "deck-genome-scanner-ml"
version = "0.1.0"
description = "Training code for the Deck Genome card scanner models (corner finder and card recognizer)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "kornia>=0.8",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "pillow>=11",
    "numpy>=2",
    "requests>=2.32",
]

# PyTorch with CUDA comes from PyTorch's own package index, not PyPI
# (the PyPI build on Windows is CPU only). cu128 covers the GTX 1660 Ti (Turing).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv]
package = false
